name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Preinstall compileSdk
        run: |
          sdkmanager "platforms;android-37.2" || \
            echo "::warning::platform 37.2 preinstall failed, AGP will resolve it automatically"

      - name: Build xposed module
        run: |
          chmod +x ./gradlew
          ./gradlew :xposed:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: bilimorphe-apk
          path: xposed/build/outputs/apk/debug/*.apk
          if-no-files-found: error
